# Option A: own subdomain. Put in /etc/nginx/sites-available/, then certbot --nginx -d api.rgs.eodyne.com
server {
    listen 80;
    server_name api.rgs.eodyne.com;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}

