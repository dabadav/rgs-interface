[project]
name = "rgs-interface"
version = "1.0.0"
description = "RGS database contract: query registry, SQL/HTTP backends, and the RGS DB API server"
authors = [{ name = "Eodyne Systems SL" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas[parquet]>=2.2.3,<3.0.0",
    "pydantic>=2.7,<3.0.0",
    "requests>=2.32,<3.0.0",
    "typer>=0.12,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0.35,<3.0.0", "pymysql>=1.1.1,<2.0.0"]
server = [
    "sqlalchemy>=2.0.35,<3.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "fastapi>=0.115,<1.0.0",
    "uvicorn[standard]>=0.30,<1.0.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "sqlalchemy>=2.0.35,<3.0.0",
    "pymysql>=1.1.1,<2.0.0",
    "fastapi>=0.115,<1.0.0",
]

[project.scripts]
rgs-cli = "rgs_interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rgs_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
