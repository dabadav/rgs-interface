# Full stack on the DB host:  docker compose up -d
#   api    rgs_interface.server on 127.0.0.1:8000 (host network → MySQL on localhost:3306)
#   caddy  TLS on :443 for $API_DOMAIN, proxies to the api. Needs ports 80/443 open.
services:
  api:
    build: .
    image: rgs-db-api:1
    network_mode: host
    env_file: .env
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  caddy:
    image: caddy:2
    network_mode: host
    env_file: .env                      # API_DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:
